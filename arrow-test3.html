<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Akıllı Dalgalı Ok</title>
<style>
.container {
  position: relative;
  margin: 0px auto;
  border: 1px dashed #ccc;
  padding: 50px;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.box {
  position: absolute;
  top: 40px;
  left: 40px;
  padding: 1rem;
  width: 200px;
  cursor: grab;
  user-select: none;
}

h1 {
  font-size: 4.2rem;
  line-height: 1.5;
  position: relative;
  z-index: 2;
  text-align: center;
  vertical-align: middle;
}

img {
  width: 2em;
  height: 1em;
}

.arrow {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.arrow path {
  /* stroke-dasharray: 8; */
  animation: moveWave 1.5s linear infinite;
}

@keyframes moveWave {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -16; }
}
</style>
</head>
<body>
<div class="container">

  <div id="box1" class="box">
    Lorem ipsum dolor sit, amet consectetur adipisicing elit. Obcaecati voluptas perferendis quis. Vel odit corrupti dolorum, quaerat consectetur sit modi fugiat quae ratione provident.
  </div>
<h1>
    Lorem, ipsum dolor <img id="box2" src="https://picsum.photos/200/300" alt="image" /> sit amet consectetur adipisicing elit. Libero voluptas excepturi rerum.
</h1>
  

  <svg id="arrow" class="arrow">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
        <polygon points="0 0, 6 3, 0 6" fill="tomato" />
      </marker>
    </defs>
    <path d="" stroke="tomato" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  </svg>
</div>

<script>
const box1 = document.getElementById("box1");
const box2 = document.getElementById("box2");
const path = document.querySelector("#arrow path");
const container = document.querySelector(".container");

function updateArrow() {
  const rect1 = box1.getBoundingClientRect();
  const rect2 = box2.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();

  // merkezleri
  const c1 = { x: rect1.left + rect1.width / 2, y: rect1.top + rect1.height / 2 };
  const c2 = { x: rect2.left + rect2.width / 2, y: rect2.top + rect2.height / 2 };

  const dx = c2.x - c1.x;
  const dy = c2.y - c1.y;

  // çıkış (div kenarı) - yön belirleme
  let x1, y1;
  if (Math.abs(dx) > Math.abs(dy)) {
    // yatay baskın
    if (dx > 0) { // sağa gidiyor
      x1 = rect1.right; y1 = c1.y;
    } else { // sola
      x1 = rect1.left; y1 = c1.y;
    }
  } else {
    // dikey baskın
    if (dy > 0) { // aşağı
      x1 = c1.x; y1 = rect1.bottom;
    } else { // yukarı
      x1 = c1.x; y1 = rect1.top;
    }
  }

  // giriş (resim kenarı)
  let x2, y2;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0) { // soldan geliyor
      x2 = rect2.left; y2 = c2.y;
    } else {
      x2 = rect2.right; y2 = c2.y;
    }
  } else {
    if (dy > 0) { // yukarıdan geliyor
      x2 = c2.x; y2 = rect2.top;
    } else {
      x2 = c2.x; y2 = rect2.bottom;
    }
  }

  // container koordinat düzeltmesi
  x1 -= containerRect.left;
  y1 -= containerRect.top;
  x2 -= containerRect.left;
  y2 -= containerRect.top;

  const ddx = x2 - x1;
  const ddy = y2 - y1;
  const length = Math.hypot(ddx, ddy);
  const steps = Math.max(4, Math.floor(length / 80));
  const curveAmplitude = Math.min(25, length / 12);

  let pathData = `M ${x1},${y1}`;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const xm = x1 + ddx * t;
    const ym = y1 + ddy * t;
    const offset = (i % 2 === 0 ? -1 : 1) * curveAmplitude;
    const cx = x1 + ddx * (t - 1 / (2 * steps));
    const cy = y1 + ddy * (t - 1 / (2 * steps)) + offset;
    pathData += ` Q ${cx},${cy} ${xm},${ym}`;
  }

  path.setAttribute("d", pathData);
}

updateArrow();
window.addEventListener("resize", updateArrow);

// 🎯 Sürükleme
let isDragging = false;
let offsetX, offsetY;

box1.addEventListener("mousedown", (e) => {
  isDragging = true;
  offsetX = e.clientX - box1.offsetLeft;
  offsetY = e.clientY - box1.offsetTop;
  box1.style.cursor = "grabbing";
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  const x = e.clientX - offsetX;
  const y = e.clientY - offsetY;
  const maxX = container.clientWidth - box1.offsetWidth;
  const maxY = container.clientHeight - box1.offsetHeight;
  box1.style.left = Math.min(Math.max(0, x), maxX) + "px";
  box1.style.top = Math.min(Math.max(0, y), maxY) + "px";
  updateArrow();
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  box1.style.cursor = "grab";
});
</script>
</body>
</html>
