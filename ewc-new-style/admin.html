<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWC Iframe Window</title>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #e5e5e5;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
    }
/* Toolbar genel görünüm */
.toolbar {
    height: 42px;
    background: white;
    border: 1px solid #cacaca;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    font-size: 15px;
    border-radius: 50px;
    margin: 7px auto;
}

/* Buton tasarımı */
.toolbar button {
    background: none;
    border: none;
    padding: 6px 8px;
    cursor: pointer;
    font-size: 15px;
    color: #444;
    border-radius: 6px;
    transition: 0.2s;
}

.toolbar button:hover {
    background: #f1f1f1;
    color: black;
}

/* Dikey ayrım çizgisi */
.toolbar .divider {
    width: 1px;
    height: 20px;
    background: #d0d0d0;
    margin: 0 4px;
}

    /* window + bar sarmalayıcı */
    .window-wrapper {
        position: relative;
        display: inline-block;
    }

    /* Container */
    .window {
    
        width: 70vw;
        height: calc(100vh - 60px);
        background: white;
        border: 1px solid #d0d0d0;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        margin-bottom: 4px;
    }

    /* MacOS üst bar */
    .mac-bar {
        height: 40px;
        background: white;
        border-bottom: 1px solid #d0d0d0;
        display: flex;
        align-items: center;
        padding: 0 12px;
        gap: 12px;
        position: relative;
    }

    /* Trafik ışıkları */
    .light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(0,0,0,0.15);
    }
    .red { background: #ff5f57; }
    .yellow { background: #ffbd2d; }
    .green { background: #28c840; }

    /* URL bar */
    .url-bar {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 30%;
        min-width: fit-content;
        height: 24px;
        background: #f1f1f1;
        border-radius: 6px;
        border: 1px solid #d4d4d4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
        color: #555;
        font-size: 12px;
        overflow: hidden;
        white-space: nowrap;
        text-align: center;
    }

    /* Sağdaki cihaz ikonları */
    .device-icons {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 16px;
        color: #555;
        cursor: pointer;
    }

    .device-icons i {
        transition: .2s;
    }

    .device-icons i:hover {
        color: black;
        transform: scale(1.05);
    }

    iframe {
        flex: 1;
        width: 100%;
        border: none;
        background: #fff;
    }

    /* Window'un DIŞINDAKİ resize bar */
    .resize-bar {
        position: absolute;
        right: -10px; /* tam olarak window'un dışında 10px */
        top: 0;
        width: 10px;
        height: 100%;
        cursor: ew-resize;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
    }

    .resize-bar::before {
        content: "";
        width: 5px;
        height: 60px;
        background: #999;
        border-radius: 2px;
    }

    #betweenContainer {
    position: absolute;
    width: 300px;
    display: none;
    pointer-events: none;
    z-index: 999999;
}

#betweenContainer .line {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    background: #1e88e5;
    transform: translateY(-50%);
}

#betweenContainer .plus {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 26px;
    height: 26px;
    transform: translate(-50%, -50%);
    background: #1e88e5;
    color: #fff;
    border-radius: 50%;
    display: flex;
    pointer-events: auto;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}
.block-menu {
    position: absolute;
    width: 220px;
    background: white;
    border-radius: 8px;
    border: 1px solid #ddd;
    box-shadow: 0 8px 22px rgba(0,0,0,0.18);
    display: none;
    z-index: 999999999;
    padding: 6px 0;
}

.block-menu .bm-item {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 15px;
    color: #333;
    transition: 0.15s;
}

.block-menu .bm-item i {
    font-size: 18px;
    color: #1e88e5;
}

.block-menu .bm-item:hover {
    background: #f5f7ff;
}

</style>

</head>
<body>
<header class="toolbar">
 <button onclick="runCommand('bold')"><i class="bi bi-type-bold"></i></button>
<button onclick="runCommand('italic')"><i class="bi bi-type-italic"></i></button>
<button onclick="runCommand('underline')"><i class="bi bi-type-underline"></i></button>

<button onclick="runCommand('formatBlock','h1')">H1</button>
<button onclick="runCommand('formatBlock','h2')">H2</button>
<button onclick="runCommand('formatBlock','h3')">H3</button>

<button onclick="runCommand('insertUnorderedList')"><i class="bi bi-list-ul"></i></button>
<button onclick="runCommand('insertOrderedList')"><i class="bi bi-list-ol"></i></button>

<button onclick="runCommand('createLink', prompt('URL gir:'))"><i class="bi bi-link-45deg"></i></button>
<button onclick="runCommand('insertImage', prompt('Resim URL:'))"><i class="bi bi-image"></i></button>

</header>

<div class="window-wrapper" id="windowWrapper">

    <div class="window" id="windowEl">

        <!-- Üst bar -->
        <div class="mac-bar">
            <!-- Trafik ışıkları -->
            <div style="display:flex; gap:6px;">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>

            <!-- Ortadaki URL bar -->
            <div class="url-bar">
                <span>https://localhost/ewc/index.html</span>
            </div>

            <!-- Sağdaki Bootstrap cihaz ikonları -->
            <div class="device-icons">
                <i class="bi bi-phone" title="Phone"></i>
                <i class="bi bi-tablet" title="Tablet"></i>
                <i class="bi bi-laptop" title="Laptop"></i>
                <i class="bi bi-display" title="Desktop"></i>
            </div>
        </div>

        <!-- iframe -->
        <iframe id="editorFrame" src="index.html"></iframe>
    </div>

    <!-- Window'un DIŞINDAKİ bar -->
    <div class="resize-bar" id="resizeBar"></div>
</div>


<div id="betweenContainer">
    <div class="line"></div>
    <div class="plus">+</div>
    <!-- Modern Block Menu -->


</div>
<div id="blockMenu" class="block-menu">
    <div class="bm-item" data-type="p"><i class="bi bi-text-paragraph"></i> Paragraf</div>
    <div class="bm-item" data-type="h1"><i class="bi bi-type-h1"></i> Başlık H1</div>
    <div class="bm-item" data-type="h2"><i class="bi bi-type-h2"></i> Başlık H2</div>
    <div class="bm-item" data-type="blockquote"><i class="bi bi-quote"></i> Alıntı</div>
    <div class="bm-item" data-type="img"><i class="bi bi-image"></i> Resim</div>
    <div class="bm-item" data-type="ul"><i class="bi bi-list-ul"></i> Liste UL</div>
    <div class="bm-item" data-type="ol"><i class="bi bi-list-ol"></i> Liste OL</div>
    <div class="bm-item" data-type="hr"><i class="bi bi-dash-lg"></i> Çizgi (HR)</div>
</div>




<script>
   const resizeBar   = document.getElementById("resizeBar");
const windowEl    = document.getElementById("windowEl");
const wrapper     = document.getElementById("windowWrapper");
const iframe      = windowEl.querySelector("iframe");

let isResizing = false;

resizeBar.addEventListener("mousedown", () => {
    isResizing = true;
    document.body.style.userSelect = "none";
    iframe.style.pointerEvents = "none";
});

document.addEventListener("mousemove", (e) => {
    if (!isResizing) return;

    const rect = wrapper.getBoundingClientRect();
    let newWidth = e.clientX - rect.left;

    const minWidth = 300;
    const maxWidth = window.innerWidth - 40;

    if (newWidth < minWidth) newWidth = minWidth;
    if (newWidth > maxWidth) newWidth = maxWidth;

    windowEl.style.width = newWidth + "px";
});

document.addEventListener("mouseup", () => {
    if (!isResizing) return;

    isResizing = false;
    document.body.style.userSelect = "";
    iframe.style.pointerEvents = "auto";
});

// ➤ CİHAZ BUTONLARI TIKLAYINCA BOYUTLANDIRMA
const deviceButtons = document.querySelectorAll(".device-icons i");

deviceButtons.forEach(btn => {
    btn.addEventListener("click", () => {

        if (btn.classList.contains("bi-phone")) {
            windowEl.style.width = "375px";     // PHONE
        }
        else if (btn.classList.contains("bi-tablet")) {
            windowEl.style.width = "768px";     // TABLET
        }
        else if (btn.classList.contains("bi-laptop")) {
            windowEl.style.width = "1366px";    // LAPTOP
        }
        else if (btn.classList.contains("bi-display")) {
            windowEl.style.width = "100vw";      // DESKTOP FULL
        }
    });
});
