<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./article-clicks.js" defer></script>
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
/>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #ff9531;
        }
    header {
      background-color: #f4f4f4;
      text-align: center;
      font-family: Arial, sans-serif;
      height: 40px;
      width: 500px;
      margin: 10px auto;
      border-radius: 50px;
      display: flex;
        align-items: center;
        justify-content: center;
    }
    iframe {
      border: 1px solid #ccc;
      border-radius: 10px;
      display: block;
      margin: 0px auto;
      width: 1000px;
      height: calc(100vh - 65px);
    }
    .baloonTextEditor{
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        color: black;
        border: 1px solid #ccc;
        border-radius: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        font-family: Arial, sans-serif; 
    }
.baloonTextEditor i {
  cursor: pointer;
  transition: transform 0.2s ease, color 0.2s ease;
  margin: 0px 5px;
}
.baloonTextEditor  i:hover {
  transform: scale(1.2);
  color: #0dcaf0;
}
    </style>
</head>
<body>

    <header>
        <h1>header</h1>
    </header>

    <iframe src="./iframe-article.html" width="1000" height="500" frameborder="0"></iframe>

    
</body>
</html>
